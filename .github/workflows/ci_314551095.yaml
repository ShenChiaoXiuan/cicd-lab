name: CI

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Run tests
        run: npm run test -- --reporter=verbose --reporter=junit --outputFile=test-results.xml

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()   # 即使測試失敗也要顯示結果
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit